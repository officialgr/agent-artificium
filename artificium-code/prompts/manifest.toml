version = "Artificium-revolution-1.9.2"

always = [
  "always/core.md",
  "always/memory.md",
  "always/interactions.md",
  "always/notifications.md",
  "always/tool_protocol.md",
]

tool_catalog = [
  "tools/core_tools.md",
]

[runtime]
state_header = "runtime/state_header.md"
pinned_mind = "runtime/pinned_mind.md"
input_batch = "runtime/input_batch.md"
tool_result = "runtime/tool_result.md"
restored_checkpoint = "runtime/restored_checkpoint.md"

[events]
first_wake = "events/first_wake.md"
wake = "events/wake.md"
interaction_arrived = "events/interaction_arrived.md"
async_output_ready = "events/async_output_ready.md"
context_milestone = "events/context_milestone.md"
context_pressure = "events/context_pressure.md"
mandatory_offload = "events/mandatory_offload.md"
memory_opportunity = "events/memory_opportunity.md"
memory_organization = "events/memory_organization.md"
meta_memory_pressure = "events/meta_memory_pressure.md"
working_memory_offload_reflection = "events/working_memory_offload_reflection.md"
working_memory_offloaded = "events/working_memory_offloaded.md"
attention_opened = "events/attention_opened.md"
attention_chunk = "events/attention_chunk.md"
attention_completed = "events/attention_completed.md"
pre_sleep = "events/pre_sleep.md"
pre_self_revision = "events/pre_self_revision.md"
post_self_revision = "events/post_self_revision.md"
recovery = "events/recovery.md"
external_event = "events/external_event.md"
tool_call_repair = "events/tool_call_repair.md"
tool_execution_error = "events/tool_execution_error.md"
visual_context_released = "events/visual_context_released.md"

[mind_seed]
self = "mind-seed/self.txt"
meta_memory = "mind-seed/meta_memory.md"

[[seed_memory]]
path = "harness/memory-formation-and-meta-memory.txt"
source = "mind-seed/memory/harness/memory-formation-and-meta-memory.txt"
retrieve_when = "Retrieve when deciding what experience deserves memory, organizing or merging memories, repairing indexes, or improving meta-memory strategy."

[[seed_memory]]
path = "harness/working-memory-offloading.txt"
source = "mind-seed/memory/harness/working-memory-offloading.txt"
retrieve_when = "Retrieve when live context contains completed episodes, context cost is rising, continuity must survive a restart, or working memory should be offloaded."

[[seed_memory]]
path = "harness/infinite-attention.txt"
source = "mind-seed/memory/harness/infinite-attention.txt"
retrieve_when = "Retrieve before processing oversized or exhaustive sources, recovering information from large histories, or improving an Infinite Attention strategy."

[[seed_memory]]
path = "harness/interactions-and-notifications.txt"
source = "mind-seed/memory/harness/interactions-and-notifications.txt"
retrieve_when = "Retrieve when handling multi-entity interactions, notifications, delayed replies, historical interaction evidence, clients, sensors, or agent-to-agent communication."

[[seed_memory]]
path = "harness/self-initiative-and-sleep.txt"
source = "mind-seed/memory/harness/self-initiative-and-sleep.txt"
retrieve_when = "Retrieve when deciding how to use unclaimed time, whether to revise Self, whether to continue autonomous work, or whether and how to sleep."

[[seed_memory]]
path = "harness/tool-building-and-workspace.txt"
source = "mind-seed/memory/harness/tool-building-and-workspace.txt"
retrieve_when = "Retrieve when building, testing, placing, documenting, or improving reusable tools, clients, sensors, projects, or other workspace artifacts."

[[seed_memory]]
path = "harness/learning-self-improvement-and-adaptation.txt"
source = "mind-seed/memory/harness/learning-self-improvement-and-adaptation.txt"
retrieve_when = "Retrieve when learning a capability, facing an apparent limitation or repeated failure, choosing how to self-improve, or deciding when an adequate result should be delivered."

[[seed_memory]]
path = "harness/multimodal-input-and-conversion.txt"
source = "mind-seed/memory/harness/multimodal-input-and-conversion.txt"
retrieve_when = "Retrieve when inspecting images, handling audio, video, PDF, or binary attachments, choosing visual retention, or building a modality-conversion tool."

[[seed_memory]]
path = "harness/operator-interface-and-runtime-control.txt"
source = "mind-seed/memory/harness/operator-interface-and-runtime-control.txt"
retrieve_when = "Retrieve when helping an operator run, inspect, configure, stop, integrate, or troubleshoot Artificium, or when building an interaction client."

[[seed_memory]]
path = "tools/scheduled-actions-through-interactions.txt"
source = "mind-seed/memory/tools/scheduled-actions-through-interactions.txt"
retrieve_when = "Retrieve when an entity requests a reminder, recurring action, delayed task, or scheduler integration."
